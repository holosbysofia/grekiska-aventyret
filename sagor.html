<script>
const pageData={"odysseyPages":[["🏝️ 🏛️ 👨‍👩‍👦 🌿","Στο όμορφο νησί της Ιθάκης ζούσε ο Οδυσσέας, ένας έξυπνος και γενναίος βασιλιάς. Αγαπούσε πολύ την Πηνελόπη και τον μικρό τους γιο, τον Τηλέμαχο. Κάθε φορά που κοιτούσε τη θάλασσα, σκεφτόταν ότι το πιο όμορφο μέρος στον κόσμο ήταν το σπίτι του.","På den vackra ön Ithaka levde Odysseus, en klok och modig kung. Han älskade Penelope och deras lille son Telemachos. När han såg ut över havet tänkte han att den vackraste platsen i världen ändå var hans hem."],["⚔️ ⛵ 👋 🌅","Ύστερα από έναν μακρύ πόλεμο, ο Οδυσσέας και οι σύντροφοί του ανέβηκαν στο καράβι. Άνοιξαν τα πανιά και ξεκίνησαν για την Ιθάκη. «Θα γυρίσουμε σπίτι!» είπε ο Οδυσσέας, ενώ ο ήλιος έδυε πίσω τους.","Efter ett långt krig gick Odysseus och hans följeslagare ombord på skeppet. De hissade seglen och styrde mot Ithaka. ”Vi ska återvända hem!” sa Odysseus medan solen sjönk bakom dem."],["⛵ 🌊 🌩️ 💨","Ξαφνικά, ο ουρανός σκοτείνιασε και ξέσπασε μια φοβερή καταιγίδα. Ο άνεμος έσπρωχνε το καράβι μακριά από τον δρόμο του και τα κύματα υψώνονταν σαν βουνά. Οι ναύτες φοβήθηκαν, αλλά ο Οδυσσέας τους έδωσε θάρρος και κράτησε γερά το τιμόνι.","Plötsligt mörknade himlen och en våldsam storm bröt ut. Vinden drev skeppet långt ur kurs och vågorna reste sig som berg. Sjömännen blev rädda, men Odysseus gav dem mod och höll stadigt i rodret."],["🏝️ 🕳️ 👁️ 🐑","Μετά από πολλές μέρες έφτασαν σε ένα άγνωστο νησί. Σε μια μεγάλη σπηλιά ζούσε ο Κύκλωπας Πολύφημος, ένας γίγαντας με ένα μόνο μάτι. Έκλεισε τη σπηλιά με έναν τεράστιο βράχο, όμως ο Οδυσσέας σκέφτηκε ένα έξυπνο σχέδιο. Οι φίλοι κρύφτηκαν ανάμεσα στα πρόβατα και κατάφεραν να βγουν έξω.","Efter många dagar kom de till en främmande ö. I en stor grotta bodde cyklopen Polyfemos, en jätte med bara ett öga. Han stängde grottan med ett stort klippblock, men Odysseus tänkte ut en listig plan. Vännerna gömde sig bland fåren och lyckades ta sig ut."],["🌊 ⛵ 🎶 🧜‍♀️","Το ταξίδι συνεχίστηκε και σύντομα ακούστηκε ένα μαγικό τραγούδι πάνω από τα κύματα. Ήταν οι Σειρήνες, που με τη φωνή τους έκαναν τους ναύτες να ξεχνούν τον δρόμο τους. Οι σύντροφοι έκλεισαν τα αυτιά τους και το καράβι πέρασε με ασφάλεια.","Resan fortsatte och snart hördes en magisk sång över vågorna. Det var sirenerna, vars röster fick sjömän att glömma vart de var på väg. Följeslagarna täckte sina öron och skeppet tog sig säkert förbi."],["🏝️ 🌳 🔥 ⭐","Οι μέρες έγιναν μήνες και οι μήνες χρόνια. Ο Οδυσσέας είδε παράξενα νησιά, κοιμήθηκε κάτω από τα αστέρια και συνάντησε πολλούς κινδύνους. Όμως κάθε βράδυ θυμόταν την Πηνελόπη, τον Τηλέμαχο και τις ελιές της Ιθάκης. Η λαχτάρα για την πατρίδα τού έδινε δύναμη να συνεχίσει.","Dagar blev till månader och månader blev till år. Odysseus såg märkliga öar, sov under stjärnorna och mötte många faror. Men varje kväll mindes han Penelope, Telemachos och olivträden på Ithaka. Längtan hem gav honom kraft att fortsätta."],["🛶 🌅 🏝️ 🫒","Κάποιο πρωινό, μέσα από την ομίχλη, ο Οδυσσέας είδε επιτέλους τις ακτές της Ιθάκης. Γονάτισε και άγγιξε το χώμα του νησιού του. Άκουσε τα πουλιά, μύρισε τις ελιές και κατάλαβε ότι το μεγάλο ταξίδι πλησίαζε στο τέλος του.","En morgon såg Odysseus äntligen Ithakas kust genom dimman. Han föll på knä och rörde vid jorden på sin ö. Han hörde fåglarna, kände doften av olivträden och förstod att den långa resan närmade sig sitt slut."],["🏡 🤗 👨‍👩‍👦 ✨","Όταν συνάντησε ξανά την Πηνελόπη και τον Τηλέμαχο, η χαρά του ήταν μεγαλύτερη από όλες τις περιπέτειες. Ο Οδυσσέας είχε μάθει ότι θάρρος δεν σημαίνει μόνο να αντιμετωπίζεις κινδύνους. Σημαίνει επίσης να μην χάνεις ποτέ την ελπίδα ότι θα βρεις τον δρόμο για το σπίτι σου.","När han återförenades med Penelope och Telemachos var glädjen större än alla äventyr. Odysseus hade lärt sig att mod inte bara betyder att möta faror. Det betyder också att aldrig ge upp hoppet om att hitta hem."]],"alphaPages":[["🏡 🔤 🦉 🌼","Στην άκρη του Αλφαβητοχωριού ζούσε το μικρό Άλφα. Το σπίτι του ήταν γεμάτο βιβλία, ζωγραφιές και γράμματα σε όλα τα χρώματα. Το Άλφα αγαπούσε να ανακαλύπτει καινούριες λέξεις και να ακούει τους ήχους τους.","I utkanten av Alfabetbyn bodde lilla Alfa. Hemmet var fyllt av böcker, teckningar och bokstäver i alla färger. Alfa älskade att upptäcka nya ord och lyssna på hur de lät."],["🌅 🗺️ 🌳 👣","Ένα πρωινό, ένα χρυσό φως φάνηκε ανάμεσα στα δέντρα. Το Άλφα ακολούθησε ένα στενό μονοπάτι και βρήκε έναν παλιό χάρτη. Πάνω του υπήρχε ένα μεγάλο Α και ένα βέλος που έδειχνε προς το δάσος.","En morgon syntes ett gyllene ljus mellan träden. Alfa följde en smal stig och hittade en gammal karta. På kartan fanns ett stort Α och en pil som pekade mot skogen."],["🌳 📦 🔐 📜","Κάτω από μια μεγάλη βελανιδιά περίμενε ένα μικρό ξύλινο κουτί. Ήταν κλειδωμένο και είχε τέσσερις άδειες θέσεις στο καπάκι. Ένα σημείωμα έγραφε: «Βρες τέσσερις λέξεις που αρχίζουν από Α και το κουτί θα ανοίξει».","Under en stor ek stod en liten ask av trä. Den var låst och hade fyra tomma platser på locket. På en lapp stod det: ”Hitta fyra ord som börjar med Α, så öppnas asken.”"],["✈️ ☁️ ☀️ Α","Ξαφνικά ακούστηκε ένας βόμβος πάνω από τα δέντρα. Ένα αεροπλάνο άφηνε μια λευκή γραμμή στον γαλάζιο ουρανό. «Αεροπλάνο!» φώναξε το Άλφα. «Η λέξη αρχίζει από Α!» Η πρώτη θέση στο κουτί άρχισε να λάμπει.","Plötsligt hördes ett brummande ljud ovanför träden. Ett flygplan ritade ett vitt streck på den blå himlen. ”Αεροπλάνο!” ropade Alfa. ”Ordet börjar med Α!” Den första platsen på asken började lysa."],["🐴 🌾 🥕 Α","Λίγο πιο κάτω, ένα καφέ άλογο στεκόταν σε ένα λιβάδι. Το Άλφα του έδωσε ένα καρότο και χάιδεψε τη μαλακή χαίτη του. «Άλογο αρχίζει από Α!» είπε. Τότε άναψε και η δεύτερη θέση.","Lite längre bort stod en brun häst på en äng. Alfa gav den en morot och klappade dess mjuka man. ”Άλογο börjar med Α!” sa Alfa. Då började även den andra platsen lysa."],["🌳 🍐 🧺 Α","Στην άκρη του μονοπατιού υπήρχε μια αχλαδιά γεμάτη ώριμα φρούτα. Ένα αχλάδι έπεσε απαλά μέσα στο καλάθι του Άλφα. «Αχλάδι! Να και η τρίτη λέξη από Α!» είπε χαρούμενο.","Vid stigens kant stod ett päronträd fullt av mogna frukter. Ett päron föll mjukt ner i Alfas korg. ”Αχλάδι! Där är det tredje ordet som börjar med Α!” sa Alfa glatt."],["🌙 ⭐ 🔭 Α","Όταν νύχτωσε, το Άλφα κοίταξε ψηλά στον ουρανό. Ανάμεσα στο φεγγάρι και στα σύννεφα έλαμπε ένα μεγάλο αστέρι. «Αστέρι αρχίζει από Α!» φώναξε. Και η τέταρτη θέση γέμισε χρυσό φως.","När kvällen kom tittade Alfa upp mot himlen. Mellan månen och molnen lyste en stor stjärna. ”Αστέρι börjar med Α!” ropade Alfa. Den fjärde platsen fylldes med gyllene ljus."],["📦 ✨ 📖 ❤️","Το κουτί άνοιξε αργά και ένα ζεστό φως απλώθηκε στο δάσος. Μέσα υπήρχε ένα μικρό βιβλίο με τις λέξεις αεροπλάνο, άλογο, αχλάδι και αστέρι. Στην τελευταία σελίδα έγραφε: «Κάθε γράμμα ανοίγει μια πόρτα σε έναν καινούριο κόσμο». Το Άλφα χαμογέλασε και πήρε τον δρόμο για το σπίτι.","Asken öppnades långsamt och ett varmt ljus spreds genom skogen. Inuti låg en liten bok med orden αεροπλάνο, άλογο, αχλάδι och αστέρι. På sista sidan stod det: ”Varje bokstav öppnar en dörr till en ny värld.” Alfa log och började gå hemåt."]],"dolphinPages":[["ένα","En","Η μικρή Δάφνη κολυμπούσε μόνη της κοντά σε έναν κοραλλιογενή ύφαλο. Έψαχνε την οικογένειά της, που είχε χαθεί πίσω από τα μεγάλα κύματα. «Θα τους βρω», είπε με θάρρος.","Den lilla delfinen Dafni simmade ensam nära ett korallrev. Hon letade efter sin familj som hade försvunnit bakom de stora vågorna. ”Jag ska hitta dem”, sa hon modigt.","🪸 🐠"],["δύο","Två","Πίσω από έναν βράχο εμφανίστηκε ο φίλος της, ο Νίκος. Τώρα ήταν δύο δελφίνια και αποφάσισαν να ψάξουν μαζί. Άκουσαν έναν μακρινό ήχο και κολύμπησαν προς τα εκεί.","Bakom en klippa dök hennes vän Nikos upp. Nu var de två delfiner och bestämde sig för att leta tillsammans. De hörde ett avlägset ljud och simmade mot det.","🪨 🐚"],["τρία","Tre","Κοντά σε ένα μικρό καράβι βρήκαν τη χαμογελαστή Έλλη. Τα τρία δελφίνια πήδηξαν πάνω από τα κύματα για να χαιρετήσουν τους ανθρώπους. Από ψηλά είδαν φυσαλίδες πιο μακριά.","Nära en liten båt hittade de den leende Elli. De tre delfinerna hoppade över vågorna för att hälsa på människorna. Från luften såg de bubblor längre bort.","⛵ 🌊"],["τέσσερα","Fyra","Οι φυσαλίδες οδηγούσαν σε μια θαλάσσια σπηλιά, όπου κρυβόταν ο Άρης. Τώρα τα δελφίνια ήταν τέσσερα. Ο Άρης ήξερε ένα μυστικό πέρασμα μέσα από τη σπηλιά.","Bubblorna ledde till en havsgrotta där Aris gömde sig. Nu var delfinerna fyra. Aris kände till en hemlig väg genom grottan.","🫧 🕳️"],["πέντε","Fem","Στην άλλη πλευρά της σπηλιάς συνάντησαν τη Λίνα, που βοηθούσε ένα μικρό ψάρι. Έγιναν πέντε δελφίνια και κολύμπησαν ήρεμα, ώστε το ψαράκι να μπορέσει να τα ακολουθήσει. Η θάλασσα λαμπύριζε γύρω τους.","På andra sidan grottan mötte de Lina som hjälpte en liten fisk. De blev fem delfiner och simmade lugnt så att fisken kunde följa med. Havet glittrade runt omkring dem.","🐟 ✨"],["έξι","Sex","Ξαφνικά άρχισε να βρέχει και τα κύματα μεγάλωσαν. Μέσα στη βροχή βρήκαν τον Πέτρο, το έκτο δελφίνι. Όλα μαζί σχημάτισαν έναν κύκλο για να μην χάσει κανείς τον δρόμο.","Plötsligt började det regna och vågorna blev större. I regnet hittade de Petros, den sjätte delfinen. Tillsammans bildade de en cirkel så att ingen skulle komma bort.","🌧️ 🌊"],["επτά","Sju","Όταν η καταιγίδα πέρασε, ένα ουράνιο τόξο φάνηκε πάνω από τη θάλασσα. Κάτω από τα χρώματά του κολυμπούσε η Σοφία. Τώρα ήταν επτά και η Δάφνη ένιωσε ότι η οικογένεια ήταν κοντά.","När stormen hade dragit förbi syntes en regnbåge över havet. Under alla färger simmade Sofia. Nu var de sju och Dafni kände att familjen var nära.","🌈 ☀️"],["οκτώ","Åtta","Τα επτά δελφίνια έφτασαν σε ένα καταπράσινο νησί. Εκεί βρήκαν τον Μάρκο να παίζει δίπλα σε μια χελώνα. Με οκτώ δελφίνια η ομάδα έγινε πιο δυνατή και η χελώνα τούς έδειξε τον δρόμο.","De sju delfinerna kom fram till en grön ö. Där hittade de Markos som lekte bredvid en sköldpadda. Med åtta delfiner blev gruppen starkare och sköldpaddan visade vägen vidare.","🏝️ 🐢"],["εννέα","Nio","Καθώς ο ήλιος έδυε, άκουσαν ένα γνώριμο τραγούδι μέσα από το νερό. Ήταν η Ίριδα, το ένατο δελφίνι, που τους καλούσε. Όλοι τραγούδησαν μαζί και η φωνή τους ταξίδεψε μακριά.","När solen gick ner hörde de en välbekant sång genom vattnet. Det var Iris, den nionde delfinen, som ropade på dem. Alla sjöng tillsammans och deras röster färdades långt.","🌅 🎵"],["δέκα","Tio","Από το βάθος της θάλασσας ήρθε η μητέρα της Δάφνης. Ήταν το δέκατο δελφίνι που έλειπε! Τα δέκα δελφίνια αγκαλιάστηκαν, πήδηξαν ψηλά και γύρισαν χαρούμενα στον ύφαλο. Η Δάφνη είχε βρει ξανά όλη την οικογένειά της.","Från havets djup kom Dafnis mamma. Hon var den tionde delfinen som saknades! De tio delfinerna samlades, hoppade högt och återvände glada till revet. Dafni hade hittat hela sin familj igen.","💙 🪸 ✨"]],"theseusPages":[["🏛️ 👑 🌊 😟","Στην αρχαία Αθήνα οι άνθρωποι ζούσαν με έναν μεγάλο φόβο. Κάθε χρόνο έπρεπε να στέλνουν νέους και νέες στην Κρήτη, όπου ο βασιλιάς Μίνωας είχε χτίσει έναν τεράστιο λαβύρινθο. Κανείς δεν ήξερε πώς να βγει από τους αμέτρητους διαδρόμους του.","I det gamla Aten levde människorna med en stor oro. Varje år måste de skicka unga människor till Kreta, där kung Minos hade byggt en väldig labyrint. Ingen visste hur man skulle hitta ut ur dess otaliga gångar."],["🛡️ 👦 👑 ⛵","Ο Θησέας, γιος του βασιλιά Αιγέα, αποφάσισε να βοηθήσει την πόλη του. «Θα πάω εγώ στην Κρήτη και θα σταματήσω αυτόν τον φόβο», είπε. Ο πατέρας του ανησύχησε, αλλά είδε την αποφασιστικότητα στα μάτια του γιου του.","Theseus, son till kung Aigeus, bestämde sig för att hjälpa sin stad. ”Jag ska resa till Kreta och sätta stopp för rädslan”, sa han. Hans far var orolig men såg beslutsamheten i sonens ögon."],["⛵ 🌊 🏝️ 🏰","Το καράβι ταξίδεψε πολλές μέρες πάνω στο γαλάζιο Αιγαίο. Όταν έφτασαν στην Κρήτη, ο Θησέας είδε το μεγάλο παλάτι της Κνωσού και τις ψηλές πύλες του λαβύρινθου. Ήξερε ότι έπρεπε να είναι θαρραλέος αλλά και προσεκτικός.","Skeppet färdades i många dagar över det blå Egeiska havet. När de kom till Kreta såg Theseus det stora palatset i Knossos och labyrintens höga portar. Han visste att han behövde vara både modig och försiktig."],["👸 🧶 🤝 ❤️","Η Αριάδνη, κόρη του βασιλιά Μίνωα, δεν ήθελε να χαθεί ο Θησέας μέσα στον λαβύρινθο. Του έδωσε ένα κουβάρι κόκκινη κλωστή. «Δέσε την άκρη στην είσοδο και ξετύλιγέ την καθώς προχωράς. Έτσι θα βρεις τον δρόμο της επιστροφής», του ψιθύρισε.","Ariadne, kung Minos dotter, ville inte att Theseus skulle gå vilse i labyrinten. Hon gav honom ett nystan med röd tråd. ”Fäst änden vid ingången och rulla ut tråden medan du går. Då hittar du vägen tillbaka”, viskade hon."],["🚪 🧱 🕯️ 🧶","Μέσα στον λαβύρινθο ήταν σκοτεινά και ήσυχα. Οι πέτρινοι διάδρομοι έστριβαν ξανά και ξανά, αλλά η κόκκινη κλωστή έμενε πίσω σαν ένα λεπτό μονοπάτι. Ο Θησέας άκουγε προσεκτικά κάθε ήχο και συνέχιζε προς το κέντρο.","Inne i labyrinten var det mörkt och tyst. Stengångarna svängde om och om igen, men den röda tråden låg kvar bakom honom som en smal stig. Theseus lyssnade noga på varje ljud och fortsatte mot mitten."],["🐂 👤 🛡️ 💫","Στην καρδιά του λαβύρινθου εμφανίστηκε ο Μινώταυρος, δυνατός και τρομακτικός. Ο Θησέας κράτησε την ψυχραιμία του, απέφυγε τις ορμητικές κινήσεις του και χρησιμοποίησε την εξυπνάδα του. Με θάρρος κατάφερε να νικήσει τον Μινώταυρο και ο φόβος της Αθήνας τελείωσε.","I labyrintens hjärta visade sig Minotauros, stark och skrämmande. Theseus behöll lugnet, undvek hans rusningar och använde sin klokhet. Med mod lyckades han besegra Minotauros och Atens långa rädsla tog slut."],["🧶 👣 🚪 🌟","Τώρα έπρεπε να βρει την έξοδο. Ο Θησέας ακολούθησε προσεκτικά την κόκκινη κλωστή, πέρασε από όλους τους διαδρόμους και είδε ξανά το φως του ουρανού. Η Αριάδνη και οι νέοι τον περίμεναν με μεγάλη ανακούφιση.","Nu behövde han hitta ut. Theseus följde noggrant den röda tråden, tog sig genom alla gångar och såg åter himlens ljus. Ariadne och de unga väntade på honom med stor lättnad."],["⛵ 🏛️ 🎉 🧶","Όταν ο Θησέας επέστρεψε στην Αθήνα, οι άνθρωποι τον υποδέχτηκαν με χαρά. Δεν ξέχασε ποτέ ότι το θάρρος του δεν θα ήταν αρκετό χωρίς τη βοήθεια και την έξυπνη ιδέα της Αριάδνης. Η κόκκινη κλωστή έγινε σύμβολο ελπίδας και θύμιζε ότι ακόμη και τα δύσκολα προβλήματα μπορούν να έχουν λύση.","När Theseus återvände till Aten tog människorna emot honom med glädje. Han glömde aldrig att hans mod inte hade räckt utan Ariadnes hjälp och kloka idé. Den röda tråden blev en symbol för hopp och för att även svåra problem kan få en lösning."]],"icarusPages":[["🏝️ 🏰 👨‍🔧 👦","Στην αρχαία Κρήτη ζούσε ο Δαίδαλος, ένας σπουδαίος τεχνίτης και εφευρέτης. Μαζί του ήταν ο νεαρός γιος του, ο Ίκαρος, που είχε μεγάλη περιέργεια για τον κόσμο. Ο Δαίδαλος μπορούσε να κατασκευάσει πράγματα που κανείς άλλος δεν είχε φανταστεί.","På det gamla Kreta levde Daidalos, en skicklig hantverkare och uppfinnare. Hos honom fanns den unge sonen Ikaros, som var mycket nyfiken på världen. Daidalos kunde bygga sådant som ingen annan hade kunnat föreställa sig."],["🗼 🔒 🌊 🕊️","Ο βασιλιάς Μίνωας δεν ήθελε να φύγουν από την Κρήτη και τους κράτησε σε έναν ψηλό πύργο κοντά στη θάλασσα. Από το παράθυρο έβλεπαν τα καράβια, αλλά δεν μπορούσαν να φτάσουν στο λιμάνι. Μόνο τα πουλιά πετούσαν ελεύθερα πάνω από τους τοίχους.","Kung Minos ville inte att de skulle lämna Kreta och höll dem i ett högt torn nära havet. Från fönstret såg de skeppen, men de kunde inte nå hamnen. Bara fåglarna flög fritt över murarna."],["🕊️ 🪶 🧵 🕯️","Ο Δαίδαλος παρατηρούσε προσεκτικά τα πουλιά και του ήρθε μια τολμηρή ιδέα. Μάζεψε μεγάλα και μικρά φτερά, τα έδεσε με κλωστή και τα στερέωσε με ζεστό κερί. Δούλευε πολλές μέρες ώσπου κατασκεύασε δύο ζευγάρια μεγάλα φτερά.","Daidalos studerade fåglarna noggrant och fick en djärv idé. Han samlade stora och små fjädrar, band ihop dem med tråd och fäste dem med varmt vax. Han arbetade i många dagar tills han hade byggt två par stora vingar."],["🪽 👨‍👦 ⚠️ ☀️","Πριν φύγουν, ο Δαίδαλος έδειξε στον Ίκαρο πώς να κινεί τα φτερά του. «Μην πετάξεις πολύ χαμηλά, γιατί η θάλασσα θα βρέξει τα φτερά. Μην πετάξεις πολύ ψηλά, γιατί ο ήλιος μπορεί να λιώσει το κερί. Μείνε κοντά μου», τον προειδοποίησε.","Innan de gav sig av visade Daidalos hur Ikaros skulle röra vingarna. ”Flyg inte för lågt, för havet kan blöta ner fjädrarna. Flyg inte heller för högt, för solen kan smälta vaxet. Håll dig nära mig”, varnade han."],["🪽 🌊 🏝️ 🐬","Οι δυο τους άνοιξαν τα φτερά και πήδηξαν στον αέρα. Για πρώτη φορά πετούσαν πάνω από τη λαμπερή θάλασσα. Οι ψαράδες κοίταζαν ψηλά από τις βάρκες τους και τα δελφίνια πηδούσαν στα κύματα από κάτω. Ο Ίκαρος γελούσε από χαρά.","De bredde ut vingarna och gav sig ut i luften. För första gången flög de över det glittrande havet. Fiskare tittade upp från sina båtar och delfiner hoppade i vågorna under dem. Ikaros skrattade av glädje."],["☀️ 🪽 ☁️ ⬆️","Ο Ίκαρος ένιωσε τόσο ελεύθερος, ώστε ξέχασε την προειδοποίηση του πατέρα του. Πέταξε ψηλότερα από τα πουλιά και πλησίασε τον λαμπερό ήλιο. Ο Δαίδαλος τον φώναζε να κατεβεί, αλλά ο άνεμος έπαιρνε μακριά τη φωνή του.","Ikaros kände sig så fri att han glömde sin fars varning. Han flög högre än fåglarna och närmade sig den strålande solen. Daidalos ropade åt honom att flyga lägre, men vinden förde bort hans röst."],["☀️ 💧 🪶 🌊","Η ζέστη του ήλιου άρχισε να λιώνει το κερί. Ένα ένα, τα φτερά ξεκόλλησαν και σκορπίστηκαν στον αέρα. Ο Ίκαρος δεν μπορούσε πια να κρατηθεί ψηλά και έπεσε στη θάλασσα. Ο μύθος λέει ότι χάθηκε μέσα στα κύματα.","Solens värme började smälta vaxet. En efter en lossnade fjädrarna och spreds i luften. Ikaros kunde inte längre hålla sig uppe och föll ner i havet. Myten berättar att han försvann bland vågorna."],["🌅 🌊 🏝️ 🕊️","Ο Δαίδαλος συνέχισε μόνος, με μεγάλη λύπη στην καρδιά του. Η θάλασσα όπου χάθηκε ο Ίκαρος ονομάστηκε Ικάριο πέλαγος και ένα κοντινό νησί πήρε το όνομα Ικαρία. Η ιστορία μάς θυμίζει ότι τα όνειρα χρειάζονται και θάρρος και σκέψη, και ότι οι καλές συμβουλές μπορούν να μας προστατεύσουν.","Daidalos fortsatte ensam med stor sorg i sitt hjärta. Havet där Ikaros försvann fick namnet Ikariska havet och en ö i närheten fick namnet Ikaria. Berättelsen påminner oss om att drömmar behöver både mod och eftertanke och att goda råd kan skydda oss."]],"midasPages":[["🏰 👑 🪙 💰","Ο βασιλιάς Μίδας ζούσε σε ένα μεγάλο παλάτι με όμορφους κήπους. Είχε γεμάτα θησαυροφυλάκια, αλλά ποτέ δεν ένιωθε ότι είχε αρκετό χρυσάφι. Κάθε βράδυ μετρούσε τα νομίσματά του και ονειρευόταν ακόμη περισσότερα.","Kung Midas levde i ett stort palats med vackra trädgårdar. Hans skattkammare var fulla, men ändå tyckte han aldrig att han hade tillräckligt med guld. Varje kväll räknade han sina mynt och drömde om ännu mer."],["🌿 🍇 ✨ 🙏","Μια μέρα ο Μίδας βοήθησε έναν φίλο του θεού Διόνυσου. Για να τον ευχαριστήσει, ο Διόνυσος του υποσχέθηκε ότι θα πραγματοποιούσε μία επιθυμία. Χωρίς να σκεφτεί πολύ, ο Μίδας ζήτησε να γίνεται χρυσάφι καθετί που αγγίζει.","En dag hjälpte Midas en av guden Dionysos vänner. Som tack lovade Dionysos att uppfylla en önskan. Utan att tänka efter särskilt länge önskade Midas att allt han rörde vid skulle bli till guld."],["🌹 ✋ ✨ 🪙","Το επόμενο πρωί ο Μίδας άγγιξε ένα κλαδί και αμέσως έγινε χρυσό. Άγγιξε ένα τριαντάφυλλο, μια πέτρα και μια ξύλινη καρέκλα· όλα έλαμψαν σαν τον ήλιο. Στην αρχή γελούσε από χαρά και πίστευε ότι είχε γίνει ο πιο τυχερός άνθρωπος στον κόσμο.","Nästa morgon rörde Midas vid en gren och den blev genast gyllene. Han rörde vid en ros, en sten och en trästol; allt glänste som solen. Först skrattade han av glädje och trodde att han hade blivit världens lyckligaste människa."],["🍞 🍎 🥤 ✨","Σύντομα κάθισε στο τραπέζι για να φάει. Όμως το ψωμί, τα φρούτα και το νερό μεταμορφώνονταν σε σκληρό χρυσάφι μόλις τα άγγιζε. Ο Μίδας πεινούσε και διψούσε, αλλά δεν μπορούσε να απολαύσει τίποτα από τον πλούτο του.","Snart satte han sig vid bordet för att äta. Men brödet, frukterna och vattnet förvandlades till hårt guld så fort han rörde vid dem. Midas var hungrig och törstig men kunde inte njuta av något av sin rikedom."],["👧 🤗 ✨ 😢","Η αγαπημένη του κόρη έτρεξε κοντά του όταν τον είδε λυπημένο. Ο Μίδας ξέχασε τη δύναμή του και την αγκάλιασε. Σε μια στιγμή το κορίτσι έγινε χρυσό άγαλμα. Τότε ο βασιλιάς κατάλαβε πόσο επικίνδυνη ήταν η επιθυμία του.","Hans älskade dotter sprang fram när hon såg att han var ledsen. Midas glömde sin kraft och kramade henne. På ett ögonblick blev flickan en staty av guld. Då förstod kungen hur farlig hans önskan var."],["👑 🙏 🍇 🌟","Ο Μίδας παρακάλεσε τον Διόνυσο να πάρει πίσω το χρυσό χάρισμα. «Δεν θέλω άλλο χρυσάφι. Θέλω την κόρη μου, το νερό και το απλό ψωμί μου», είπε. Ο Διόνυσος είδε ότι είχε μετανιώσει πραγματικά και του έδειξε πώς να ελευθερωθεί.","Midas bad Dionysos att ta tillbaka den gyllene gåvan. ”Jag vill inte ha mer guld. Jag vill ha min dotter, vatten och mitt enkla bröd”, sa han. Dionysos såg att han verkligen ångrade sig och berättade hur han kunde bli fri."],["🏞️ 💦 ✋ 👧","Ο βασιλιάς έτρεξε στον ποταμό Πακτωλό και έπλυνε τα χέρια του στο νερό. Η μαγική δύναμη έφυγε από πάνω του και χρυσές νιφάδες έλαμψαν στην άμμο του ποταμού. Όταν γύρισε στο παλάτι και άγγιξε την κόρη του, εκείνη ζωντάνεψε ξανά.","Kungen sprang till floden Paktolos och tvättade händerna i vattnet. Den magiska kraften lämnade honom och gyllene flingor glimmade i flodens sand. När han återvände till palatset och rörde vid sin dotter blev hon levande igen."],["🌳 👨‍👧 🍞 ❤️","Από εκείνη την ημέρα ο Μίδας περνούσε περισσότερο χρόνο με την οικογένειά του και λιγότερο με τα νομίσματά του. Έμαθε να χαίρεται το φαγητό, το νερό, τα λουλούδια και μια ζεστή αγκαλιά. Κατάλαβε ότι η αγάπη και η ζωή αξίζουν περισσότερο από όλο το χρυσάφι του κόσμου.","Från den dagen tillbringade Midas mer tid med sin familj och mindre tid med sina mynt. Han lärde sig att uppskatta mat, vatten, blommor och en varm kram. Han förstod att kärlek och liv är värda mer än allt guld i världen."]],"aesopPages":[["🌳 ☀️ 🦁 😴","Μια ζεστή μέρα, ένα μεγάλο λιοντάρι κοιμόταν κάτω από τη σκιά ενός δέντρου. Είχε κυνηγήσει όλο το πρωί και τώρα ξεκουραζόταν ήσυχα. Τα πουλιά κελαηδούσαν και το γρασίδι κουνιόταν απαλά στον άνεμο.","En varm dag sov ett stort lejon i skuggan under ett träd. Det hade jagat hela morgonen och vilade nu lugnt. Fåglarna sjöng och gräset rörde sig mjukt i vinden."],["🐭 🌰 🐾 🦁","Ένα μικρό ποντίκι έτρεχε ανάμεσα στα φύλλα ψάχνοντας σπόρους. Δεν πρόσεξε το λιοντάρι και σκαρφάλωσε πάνω στη μεγάλη του πατούσα. Το λιοντάρι ξύπνησε απότομα και έπιασε το ποντίκι με το δυνατό του πόδι.","En liten mus sprang bland löven och letade efter frön. Den såg inte lejonet och klättrade upp på dess stora tass. Lejonet vaknade plötsligt och fångade musen med sin starka fot."],["🦁 😠 🐭 🙏","«Πώς τόλμησες να με ξυπνήσεις;» βρυχήθηκε το λιοντάρι. Το ποντίκι έτρεμε, αλλά μάζεψε το θάρρος του. «Σε παρακαλώ, άφησέ με ελεύθερο. Κάποια μέρα μπορεί κι εγώ να σε βοηθήσω», είπε με μικρή φωνή.","”Hur vågade du väcka mig?” röt lejonet. Musen darrade men samlade sitt mod. ”Snälla, släpp mig fri. En dag kanske även jag kan hjälpa dig”, sa den med liten röst."],["🦁 😄 🐭 🌿","Το λιοντάρι γέλασε όταν άκουσε την υπόσχεση. Δεν μπορούσε να φανταστεί πώς ένα τόσο μικρό ποντίκι θα βοηθούσε τον βασιλιά των ζώων. Όμως ένιωσε καλοσύνη και σήκωσε την πατούσα του. Το ποντίκι έτρεξε μακριά και τον ευχαρίστησε.","Lejonet skrattade när det hörde löftet. Det kunde inte föreställa sig hur en så liten mus skulle kunna hjälpa djurens kung. Men lejonet kände sig vänligt och lyfte på tassen. Musen sprang i väg och tackade."],["🌲 🪢 🦁 😨","Λίγες μέρες αργότερα, το λιοντάρι περπατούσε στο δάσος και πάτησε σε μια παγίδα κυνηγών. Ένα δυνατό δίχτυ έκλεισε γύρω του και το σήκωσε από το έδαφος. Όσο περισσότερο προσπαθούσε να φύγει, τόσο περισσότερο μπλεκόταν.","Några dagar senare gick lejonet genom skogen och trampade i en jägarfälla. Ett starkt nät slöt sig runt det och lyfte det från marken. Ju mer lejonet kämpade, desto mer trasslade det in sig."],["🐭 👂 🦁 🦷","Το ποντίκι άκουσε τον δυνατό βρυχηθμό και έτρεξε προς τον φίλο του. «Μη φοβάσαι, θα σε βοηθήσω!» είπε. Με τα μικρά αλλά κοφτερά δόντια του άρχισε να ροκανίζει τα σκοινιά, ένα ένα, χωρίς να σταματά.","Musen hörde det höga rytandet och sprang till sin vän. ”Var inte rädd, jag ska hjälpa dig!” sa den. Med sina små men vassa tänder började musen gnaga av repen, ett efter ett, utan att ge upp."],["🦁 🤝 🐭 ✨","Σε λίγο το δίχτυ άνοιξε και το λιοντάρι ήταν πάλι ελεύθερο. «Έκανα λάθος που γέλασα μαζί σου», είπε. «Η βοήθεια δεν μετριέται με το μέγεθος». Από τότε το λιοντάρι και το ποντίκι έγιναν καλοί φίλοι και θυμούνταν ότι κανείς δεν είναι τόσο μικρός ώστε να μην μπορεί να προσφέρει κάτι σημαντικό.","Snart öppnades nätet och lejonet var fritt igen. ”Jag hade fel när jag skrattade åt dig”, sa det. ”Hjälp mäts inte i storlek.” Från den dagen blev lejonet och musen goda vänner och mindes att ingen är för liten för att kunna göra något viktigt."]],"harePages":[["🌳 🐇 💨 🐢","Σε ένα καταπράσινο δάσος ζούσε ένας λαγός που ήταν πολύ περήφανος για την ταχύτητά του. Έτρεχε ανάμεσα στα δέντρα και καυχιόταν σε όλα τα ζώα. Συχνά γελούσε με τη χελώνα επειδή περπατούσε αργά.","I en grön skog levde en hare som var mycket stolt över sin snabbhet. Han sprang mellan träden och skröt inför alla djuren. Ofta skrattade han åt sköldpaddan för att hon gick långsamt."],["🐢 💬 🐇 😄","Μια μέρα η χελώνα κουράστηκε να ακούει τα πειράγματά του. «Μπορεί να είμαι αργή, αλλά δεν σταματώ εύκολα. Θέλεις να κάνουμε έναν αγώνα;» ρώτησε ήρεμα. Ο λαγός γέλασε δυνατά, αλλά δέχτηκε αμέσως.","En dag tröttnade sköldpaddan på att höra hans retande. ”Jag kanske är långsam, men jag stannar inte så lätt. Vill du tävla?” frågade hon lugnt. Haren skrattade högt men tackade genast ja."],["🦊 🚩 🐇 🐢","Η αλεπού χάραξε τη διαδρομή και όλα τα ζώα συγκεντρώθηκαν για να παρακολουθήσουν. Με το σύνθημα, ο λαγός πετάχτηκε μπροστά σαν τον άνεμο. Η χελώνα ξεκίνησε αργά, βάζοντας το ένα πόδι μπροστά από το άλλο.","Räven markerade banan och alla djuren samlades för att titta. Vid startsignalen rusade haren i väg som vinden. Sköldpaddan började långsamt och satte den ena foten framför den andra."],["🐇 🌳 😴 ☀️","Σε λίγο ο λαγός ήταν τόσο μπροστά, ώστε δεν έβλεπε πια τη χελώνα. «Έχω άφθονο χρόνο», σκέφτηκε. Ξάπλωσε κάτω από ένα δέντρο για να ξεκουραστεί λίγο, αλλά ο ζεστός ήλιος τον έκανε να αποκοιμηθεί βαθιά.","Snart var haren så långt före att han inte längre kunde se sköldpaddan. ”Jag har gott om tid”, tänkte han. Han lade sig under ett träd för att vila en liten stund, men den varma solen fick honom att somna djupt."],["🐢 🌼 🪨 👣","Η χελώνα συνέχισε χωρίς να σταματήσει. Πέρασε δίπλα από λουλούδια, ανέβηκε πάνω από μικρές πέτρες και προχώρησε ακόμη όταν τα πόδια της κουράστηκαν. Δεν κοίταζε πόσο μακριά ήταν ο τερματισμός· σκεφτόταν μόνο το επόμενο βήμα.","Sköldpaddan fortsatte utan att stanna. Hon passerade blommor, tog sig över små stenar och gick vidare även när benen blev trötta. Hon tänkte inte på hur långt det var till målet utan bara på nästa steg."],["🐇 😲 🐢 🏁","Ο λαγός ξύπνησε ξαφνικά και είδε ότι ο ήλιος είχε προχωρήσει στον ουρανό. Πετάχτηκε όρθιος και άρχισε να τρέχει όσο πιο γρήγορα μπορούσε. Όμως κοντά στη γραμμή του τερματισμού είδε τη χελώνα να κάνει τα τελευταία ήρεμα βήματά της.","Haren vaknade plötsligt och såg att solen hade flyttat sig över himlen. Han hoppade upp och sprang så fort han kunde. Men nära mållinjen såg han sköldpaddan ta sina sista lugna steg."],["🐢 🏆 🎉 🐇","Η χελώνα πέρασε πρώτη τη γραμμή του τερματισμού και τα ζώα ξέσπασαν σε χαρές. Ο λαγός έφτασε λίγο αργότερα και παραδέχτηκε το λάθος του. Έμαθε ότι η ικανότητα δεν αρκεί χωρίς προσπάθεια, και ότι όποιος προχωρά σταθερά μπορεί να φτάσει πολύ μακριά.","Sköldpaddan passerade mållinjen först och djuren jublade. Haren kom fram strax efteråt och erkände sitt misstag. Han lärde sig att talang inte räcker utan ansträngning och att den som fortsätter stadigt kan nå mycket långt."]],"foxPages":[["🌞 🦊 🌾 😋","Ένα ζεστό απόγευμα, μια αλεπού περπατούσε πεινασμένη στην εξοχή. Είχε ψάξει παντού για φαγητό, αλλά δεν είχε βρει τίποτα. Ξαφνικά ένιωσε μια γλυκιά μυρωδιά να έρχεται από έναν κοντινό αμπελώνα.","En varm eftermiddag vandrade en hungrig räv genom landskapet. Hon hade letat överallt efter mat men inte hittat något. Plötsligt kände hon en söt doft från en vingård i närheten."],["🍇 🌿 🦊 ✨","Ψηλά πάνω σε μια κληματαριά κρέμονταν μεγάλα τσαμπιά με ώριμα, μοβ σταφύλια. Οι ρώγες γυάλιζαν στον ήλιο και η αλεπού σχεδόν μπορούσε να γευτεί τον γλυκό χυμό τους. «Αυτά τα σταφύλια είναι ακριβώς ό,τι χρειάζομαι!» είπε.","Högt uppe på en vinranka hängde stora klasar med mogna, lila druvor. Druvorna glänste i solen och räven kunde nästan känna deras söta smak. ”De där druvorna är precis vad jag behöver!” sa hon."],["🦊 ⬆️ 🍇 💨","Η αλεπού πήρε φόρα και πήδηξε όσο πιο ψηλά μπορούσε. Τα δόντια της πλησίασαν τα σταφύλια, αλλά δεν τα έφτασαν. Δοκίμασε ξανά και ξανά, κάθε φορά με μεγαλύτερη δύναμη, όμως τα τσαμπιά παρέμεναν λίγο πιο πάνω.","Räven tog sats och hoppade så högt hon kunde. Tänderna kom nära druvorna men nådde inte fram. Hon försökte om och om igen, varje gång med större kraft, men klasarna hängde fortfarande lite för högt."],["🪨 🪵 🦊 🍇","Τότε έσπρωξε μια πέτρα κάτω από την κληματαριά και προσπάθησε να σταθεί επάνω της. Έπειτα έσυρε έναν παλιό κορμό, αλλά αυτός κύλησε μακριά. Κουρασμένη και σκονισμένη κοίταξε τα σταφύλια που εξακολουθούσαν να κρέμονται ψηλά.","Då sköt hon en sten under vinrankan och försökte stå på den. Sedan släpade hon dit en gammal stock, men den rullade undan. Trött och dammig tittade hon upp på druvorna som fortfarande vajade ovanför henne."],["🦊 😤 🍇 🚶","Η αλεπού δεν ήθελε να παραδεχτεί ότι ήταν απογοητευμένη. Σήκωσε τη μύτη της και είπε δυνατά: «Έτσι κι αλλιώς, αυτά τα σταφύλια είναι σίγουρα ξινά!» Γύρισε την πλάτη της και απομακρύνθηκε, παρόλο που πριν από λίγο τα ήθελε πάρα πολύ.","Räven ville inte erkänna att hon var besviken. Hon höjde nosen och sa högt: ”De där druvorna är säkert sura ändå!” Sedan vände hon ryggen till och gick därifrån, trots att hon nyss hade önskat sig dem väldigt mycket."],["🌅 🦊 💭 ❤️","Καθώς περπατούσε προς το δάσος, η αλεπού κατάλαβε γιατί είχε μιλήσει έτσι. Ήταν πιο εύκολο να κατηγορήσει τα σταφύλια παρά να παραδεχτεί ότι δεν μπορούσε να τα φτάσει. Ο μύθος μάς θυμίζει να είμαστε ειλικρινείς με την απογοήτευσή μας και να μην υποτιμούμε κάτι μόνο επειδή είναι δύσκολο να το αποκτήσουμε.","När räven gick tillbaka mot skogen förstod hon varför hon hade talat så. Det var lättare att skylla på druvorna än att säga att hon inte kunde nå dem. Fabeln påminner oss om att vara ärliga med vår besvikelse och att inte tala illa om något bara för att det är svårt att få."]],"wolfPages":[["🐑 🌄 👦 🌿","Κάθε πρωί, ένα νεαρό αγόρι οδηγούσε τα πρόβατα του χωριού σε έναν πράσινο λόφο. Η δουλειά του ήταν να τα προσέχει ώσπου να δύσει ο ήλιος. Οι χωρικοί τού είχαν πει: «Αν εμφανιστεί λύκος, φώναξε δυνατά και θα έρθουμε αμέσως». Έτσι το αγόρι καθόταν στο γρασίδι και παρατηρούσε το κοπάδι.","Varje morgon ledde en ung pojke byns får till en grön kulle. Hans uppgift var att vakta dem tills solen gick ner. Byborna hade sagt: ”Om en varg kommer ska du ropa högt, så kommer vi genast.” Pojken satt därför i gräset och höll ett öga på flocken."],["☀️ 🐑 😐 ⏳","Οι ώρες περνούσαν αργά. Τα πρόβατα έβοσκαν ήσυχα, τα πουλιά κελαηδούσαν και τίποτα συναρπαστικό δεν συνέβαινε. Το αγόρι άρχισε να βαριέται. Τότε σκέφτηκε ένα αστείο που, όπως πίστευε, θα έκανε τη μέρα πιο ενδιαφέρουσα.","Timmarna gick långsamt. Fåren betade lugnt, fåglarna sjöng och ingenting spännande hände. Pojken började bli uttråkad. Då kom han på ett skämt som han trodde skulle göra dagen roligare."],["👦 📣 🐺 🏃","«Λύκος! Λύκος! Βοήθεια!» φώναξε όσο πιο δυνατά μπορούσε. Οι χωρικοί άφησαν αμέσως τις δουλειές τους και έτρεξαν στον λόφο με ξύλα και εργαλεία. Όταν έφτασαν λαχανιασμένοι, δεν είδαν κανέναν λύκο. Το αγόρι γελούσε με το πόσο γρήγορα είχαν τρέξει.","”Varg! Varg! Hjälp!” ropade han så högt han kunde. Byborna lämnade genast sina arbeten och sprang uppför kullen med käppar och redskap. När de kom fram andfådda såg de ingen varg. Pojken skrattade åt hur fort de hade sprungit."],["🧑‍🌾 ☝️ 👦 😶","Οι χωρικοί δεν γέλασαν. «Δεν είναι παιχνίδι να ζητάς βοήθεια χωρίς να υπάρχει κίνδυνος», του είπαν. «Αν λες ψέματα, οι άλλοι μπορεί να μη σε πιστέψουν όταν θα λες την αλήθεια». Το αγόρι υποσχέθηκε να μην το ξανακάνει, αλλά σύντομα βαρέθηκε πάλι.","Byborna skrattade inte. ”Det är ingen lek att ropa på hjälp när det inte finns någon fara”, sa de. ”Om du ljuger kanske andra inte tror dig när du talar sanning.” Pojken lovade att inte göra om det, men snart blev han uttråkad igen."],["📣 🐺 🏃‍♀️ 😂","Για δεύτερη φορά φώναξε: «Λύκος! Ελάτε γρήγορα!» Οι χωρικοί έτρεξαν ξανά, επειδή δεν ήθελαν να αφήσουν τα πρόβατα απροστάτευτα. Μα πάλι δεν υπήρχε λύκος. Όταν είδαν το αγόρι να γελά, γύρισαν στο χωριό θυμωμένοι και απογοητευμένοι.","För andra gången ropade han: ”Varg! Kom fort!” Byborna sprang dit igen eftersom de inte ville lämna fåren oskyddade. Men inte heller denna gång fanns någon varg. När de såg pojken skratta gick de tillbaka till byn, arga och besvikna."],["🌆 🐺 👀 🐑","Λίγες μέρες αργότερα, την ώρα που ο ουρανός σκοτείνιαζε, ένας αληθινός λύκος βγήκε αθόρυβα από το δάσος. Τα πρόβατα μαζεύτηκαν φοβισμένα. Το αγόρι ένιωσε την καρδιά του να χτυπά δυνατά και κατάλαβε πως αυτή τη φορά ο κίνδυνος ήταν πραγματικός.","Några dagar senare, när himlen började mörkna, smög en riktig varg ut ur skogen. Fåren trängde ihop sig av rädsla. Pojkens hjärta slog hårt och han förstod att faran den här gången var verklig."],["👦 📣 🏘️ 🤷","«Λύκος! Σας παρακαλώ, βοηθήστε με!» φώναζε ξανά και ξανά. Στο χωριό οι άνθρωποι άκουσαν τη φωνή του, αλλά θυμήθηκαν τα δύο ψέματα. «Μας κοροϊδεύει πάλι», σκέφτηκαν, και κανείς δεν έτρεξε αμέσως στον λόφο. Το αγόρι προσπάθησε μόνο του να οδηγήσει τα πρόβατα μακριά.","”Varg! Snälla, hjälp mig!” ropade han om och om igen. I byn hörde människorna honom men mindes hans två lögner. ”Han lurar oss igen”, tänkte de, och ingen sprang genast upp till kullen. Pojken försökte ensam föra fåren bort från faran."],["🌅 🐑 🤝 ❤️","Τελικά ένας χωρικός είδε τον λύκο και όλοι έτρεξαν στον λόφο. Έδιωξαν το ζώο και βοήθησαν το αγόρι να συγκεντρώσει τα φοβισμένα πρόβατα. Το αγόρι ζήτησε συγγνώμη και κατάλαβε κάτι σημαντικό: η εμπιστοσύνη χτίζεται με την αλήθεια, αλλά μπορεί να χαθεί γρήγορα με τα ψέματα.","Till slut upptäckte en bybo vargen och alla skyndade dit. De jagade bort den och hjälpte pojken att samla ihop de rädda fåren. Pojken bad om ursäkt och förstod något viktigt: förtroende byggs genom sanningen, men kan snabbt gå förlorat när man ljuger."]],"goosePages":[["🏡 👨‍🌾 👩‍🌾 🪿","Σε ένα μικρό χωριό ζούσαν ένας γεωργός και η γυναίκα του. Εργάζονταν από το πρωί ως το βράδυ, αλλά τα χρήματά τους έφταναν μόνο για τα απαραίτητα. Στην αυλή τους είχαν λίγες κότες και μια όμορφη άσπρη χήνα, την οποία φρόντιζαν καθημερινά.","I en liten by bodde en bonde och hans hustru. De arbetade från morgon till kväll, men pengarna räckte bara till det nödvändigaste. På gården hade de några hönor och en vacker vit gås som de skötte varje dag."],["🌅 🪺 ✨ 🥚","Ένα πρωί, ο γεωργός πήγε στη φωλιά της χήνας και είδε κάτι να λάμπει μέσα στο άχυρο. Ήταν ένα αυγό βαρύ και χρυσαφένιο. Στην αρχή πίστεψε ότι κάποιος του έκανε αστείο, αλλά ο χρυσοχόος του χωριού επιβεβαίωσε πως το αυγό ήταν από καθαρό χρυσάφι.","En morgon gick bonden till gåsens bo och såg något som glänste i halmen. Det var ett tungt, gyllene ägg. Först trodde han att någon skämtade med honom, men byns guldsmed bekräftade att ägget var av rent guld."],["📅 🪿 🥚 😊","Την επόμενη μέρα η χήνα γέννησε άλλο ένα χρυσό αυγό. Το ίδιο συνέβη και την τρίτη μέρα, και ύστερα κάθε πρωί. Το ζευγάρι πούλησε προσεκτικά τα αυγά, πλήρωσε τα χρέη του και επισκεύασε το σπίτι. Για πρώτη φορά ένιωθε ασφαλές και ευγνώμον.","Nästa dag lade gåsen ännu ett guldägg. Samma sak hände den tredje dagen och sedan varje morgon. Paret sålde försiktigt äggen, betalade sina skulder och lagade huset. För första gången kände de sig trygga och tacksamma."],["💰 🏠 👀 💭","Με τον καιρό, όμως, ο γεωργός άρχισε να σκέφτεται διαφορετικά. Δεν χαιρόταν πια για το ένα αυγό την ημέρα. Κοιτούσε τα νομίσματα και αναρωτιόταν πόσο πλούσιος θα γινόταν αν έπαιρνε όλο το χρυσάφι της χήνας αμέσως.","Med tiden började bonden tänka annorlunda. Han gladdes inte längre åt ett ägg om dagen. Han tittade på sina mynt och undrade hur rik han skulle bli om han kunde få allt guld ur gåsen på en gång."],["👩‍🌾 ✋ 👨‍🌾 ⚠️","Η γυναίκα του προσπάθησε να τον σταματήσει. «Η χήνα μάς δίνει ήδη περισσότερα απ’ όσα χρειαζόμαστε», του είπε. «Ας τη φροντίζουμε και ας κάνουμε υπομονή». Εκείνος, όμως, δεν άκουγε. Η ανυπομονησία και η απληστία είχαν γίνει πιο δυνατές από τη λογική του.","Hans hustru försökte stoppa honom. ”Gåsen ger oss redan mer än vi behöver”, sa hon. ”Låt oss ta hand om henne och ha tålamod.” Men han lyssnade inte. Otåligheten och girigheten hade blivit starkare än hans förnuft."],["🌙 🪿 😟 💔","Εκείνο το βράδυ, ο γεωργός πήρε τη χήνα, πιστεύοντας ότι θα βρει μέσα της έναν μεγάλο θησαυρό. Όταν την άνοιξε, ανακάλυψε πως ήταν μια συνηθισμένη χήνα. Δεν υπήρχε ούτε χρυσάφι ούτε κρυμμένος θησαυρός. Τότε κατάλαβε το τρομερό λάθος του.","Den kvällen tog bonden gåsen eftersom han trodde att en stor skatt fanns inuti den. När han öppnade den upptäckte han att den var precis som en vanlig gås. Där fanns varken guld eller någon gömd skatt. Då förstod han sitt fruktansvärda misstag."],["🌄 🪹 🚫 🥚","Το επόμενο πρωί, η φωλιά ήταν άδεια. Δεν υπήρχε χρυσό αυγό και δεν θα υπήρχε ποτέ ξανά. Ο γεωργός είχε θελήσει να αποκτήσει τα πάντα αμέσως, αλλά τελικά έχασε το δώρο που βελτίωνε σιγά σιγά τη ζωή της οικογένειάς του.","Nästa morgon var boet tomt. Det kom inget guldägg och det skulle aldrig komma något mer. Bonden hade velat få allt på en gång, men i stället hade han förlorat den gåva som långsamt hade gett familjen ett bättre liv."],["🌾 🤲 ❤️ 🥚","Ο γεωργός μετάνιωσε βαθιά. Από τότε εργαζόταν με μεγαλύτερη υπομονή και θυμόταν τη χήνα κάθε φορά που ήθελε περισσότερα απ’ όσα πραγματικά χρειαζόταν. Ο μύθος μάς διδάσκει ότι η απληστία μπορεί να μας κάνει να χάσουμε ακόμη και τα καλά που έχουμε ήδη.","Bonden ångrade sig djupt. Därefter arbetade han med större tålamod och mindes gåsen varje gång han önskade sig mer än han egentligen behövde. Fabeln lär oss att girighet kan få oss att förlora även det goda vi redan har."]],"antPages":[["☀️ 🌻 🐜 🎵","Ήταν καλοκαίρι και ο ήλιος ζέσταινε τα χωράφια. Ένα μυρμήγκι περπατούσε ανάμεσα στα στάχυα, κουβαλώντας έναν σπόρο μεγαλύτερο από το κεφάλι του. Κοντά του, ένας τζίτζικας καθόταν πάνω σε ένα κλαδί, τραγουδούσε χαρούμενα και απολάμβανε τη ζεστή μέρα.","Det var sommar och solen värmde fälten. En myra gick mellan sädesstråna och bar ett frö som var större än hennes huvud. I närheten satt en gräshoppa på en gren, sjöng glatt och njöt av den varma dagen."],["🐜 🌾 🏠 💪","Το μυρμήγκι μάζευε σπόρους και τους μετέφερε στην αποθήκη κάτω από τη γη. Η διαδρομή ήταν μεγάλη και η δουλειά κουραστική, μα εκείνο ήξερε ότι μετά το καλοκαίρι θα ερχόταν το κρύο. Κάθε μικρός σπόρος θα ήταν πολύτιμος τον χειμώνα.","Myran samlade frön och bar dem till förrådet under marken. Vägen var lång och arbetet tröttande, men hon visste att kylan skulle komma efter sommaren. Varje litet frö skulle bli värdefullt under vintern."],["🎶 🦗 😄 🐜","Ο τζίτζικας γέλασε όταν είδε το μυρμήγκι να εργάζεται. «Γιατί κουράζεσαι τόσο;» ρώτησε. «Έλα να τραγουδήσουμε και να χαρούμε τον ήλιο!» Το μυρμήγκι σταμάτησε για λίγο και απάντησε: «Θα ξεκουραστώ αργότερα. Τώρα ετοιμάζομαι για τον χειμώνα».","Gräshoppan skrattade när han såg myran arbeta. ”Varför sliter du så?” frågade han. ”Kom och sjung med mig och njut av solen!” Myran stannade en stund och svarade: ”Jag vilar senare. Nu förbereder jag mig för vintern.”"],["🌤️ 🎻 🦗 ⏳","Οι μέρες περνούσαν. Ο τζίτζικας τραγουδούσε, χόρευε και πίστευε ότι το καλοκαίρι δεν θα τελείωνε ποτέ. Έβρισκε εύκολα τροφή στα πράσινα λιβάδια και δεν σκεφτόταν το αύριο. Το μυρμήγκι συνέχιζε τη δουλειά του, αλλά φρόντιζε επίσης να ξεκουράζεται κάθε βράδυ.","Dagarna gick. Gräshoppan sjöng, dansade och trodde att sommaren aldrig skulle ta slut. Han hittade lätt mat på de gröna ängarna och tänkte inte på morgondagen. Myran fortsatte arbeta men såg också till att vila varje kväll."],["🍂 💨 🦗 😟","Ύστερα ήρθε το φθινόπωρο. Τα φύλλα κιτρίνισαν, ο άνεμος δυνάμωσε και η τροφή άρχισε να λιγοστεύει. Ο τζίτζικας έψαχνε ανάμεσα στα ξερά χόρτα, αλλά έβρισκε όλο και λιγότερα. Για πρώτη φορά θυμήθηκε τα λόγια του μυρμηγκιού.","Sedan kom hösten. Löven gulnade, vinden blev starkare och maten började ta slut. Gräshoppan letade bland det torra gräset men hittade allt mindre. För första gången mindes han myrans ord."],["❄️ 🦗 🥶 🚪","Όταν έπεσε το πρώτο χιόνι, ο τζίτζικας κρύωνε και πεινούσε. Πήγε στο σπίτι του μυρμηγκιού και χτύπησε διστακτικά την πόρτα. «Δεν προετοιμάστηκα», παραδέχτηκε. «Μπορείς να με βοηθήσεις; Υπόσχομαι να μάθω από το λάθος μου».","När den första snön föll frös gräshoppan och var hungrig. Han gick till myrans hem och knackade försiktigt på dörren. ”Jag förberedde mig inte”, erkände han. ”Kan du hjälpa mig? Jag lovar att lära mig av mitt misstag.”"],["🐜 🤝 🦗 🍲","Το μυρμήγκι είδε ότι ο τζίτζικας μιλούσε ειλικρινά. Τον κάλεσε μέσα, του πρόσφερε ζεστό φαγητό και μοιράστηκε ένα μέρος από τις προμήθειές του. «Η βοήθεια είναι σημαντική», είπε, «αλλά είναι επίσης σημαντικό να αναλαμβάνουμε την ευθύνη για το μέλλον μας».","Myran såg att gräshoppan talade ärligt. Hon bjöd in honom, gav honom varm mat och delade med sig av sitt förråd. ”Det är viktigt att hjälpa”, sa hon, ”men det är också viktigt att ta ansvar för sin framtid.”"],["🌱 🐜 🦗 🎶","Όταν επέστρεψε η άνοιξη, ο τζίτζικας βοήθησε το μυρμήγκι να μαζέψει τροφή. Δούλευαν μαζί τα πρωινά και μερικές φορές ξεκουράζονταν ακούγοντας τη μουσική του. Έμαθαν ότι η ζωή χρειάζεται και χαρά και προνοητικότητα: χρόνο για δουλειά, χρόνο για ξεκούραση και φροντίδα ο ένας για τον άλλον.","När våren kom tillbaka hjälpte gräshoppan myran att samla mat. De arbetade tillsammans på morgnarna och vilade ibland till hans musik. De lärde sig att livet behöver både glädje och framförhållning: tid att arbeta, tid att vila och omtanke om varandra."]]};

const $=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5);let current=null,page=0,completed=new Set(JSON.parse(localStorage.getItem('greekCompletedStories')||'[]'));
function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='el-GR';u.rate=.72;speechSynthesis.speak(u)}
function renderCards(filter='Alla'){$('storyGrid').innerHTML='';stories.filter(s=>filter==='Alla'||s.group===filter).forEach(s=>{const c=document.createElement('article');c.className='story';c.innerHTML='<div class="story-pic">'+s.pic+'</div><div class="story-body"><span class="tag">'+s.group.toUpperCase()+' · '+s.age+'</span><h2>'+s.sv+'</h2><h3>'+s.gr+'</h3><p>'+s.desc+'</p>'+(completed.has(s.key)?'<span class="done-badge">✓ Läst till slutet</span>':'')+'<button>📖 Öppna sagan</button></div>';c.querySelector('button').onclick=()=>openStory(s);$('storyGrid').appendChild(c)})}
document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderCards(b.dataset.filter)});
function openStory(s){current=s;page=0;$('reader').classList.remove('hide');$('readerTag').textContent=s.group.toUpperCase()+' · '+s.age;$('readerTitle').textContent=s.sv;$('readerGreekTitle').textContent=s.gr;renderPage();$('reader').scrollIntoView({behavior:'smooth',block:'start'})}
function storyPage(raw,index){return raw.length===5?{scene:'🐬 '.repeat(index+1)+raw[4],greek:raw[2],swedish:raw[3]}:{scene:raw[0],greek:raw[1],swedish:raw[2]}}
function renderPage(){const pages=pageData[current.key],p=storyPage(pages[page],page),last=page===pages.length-1;$('readerScene').textContent=p.scene;$('readerGreek').textContent=p.greek;$('readerSwedish').textContent=p.swedish;$('readerProgress').textContent='Sida '+(page+1)+' av '+pages.length+(last?' · Sagan är slut':'');$('prev').disabled=page===0;$('next').classList.toggle('hide',last);$('ending').classList.toggle('hide',!last);$('question').classList.toggle('hide',!last);if(last){completed.add(current.key);localStorage.setItem('greekCompletedStories',JSON.stringify([...completed]));buildQuestion()}window.scrollTo({top:$('reader').offsetTop-80,behavior:'smooth'})}
function buildQuestion(){$('questionText').textContent=current.q;$('questionFeedback').textContent='';$('answers').innerHTML='';shuffle(current.o).forEach(o=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{document.querySelectorAll('#answers button').forEach(x=>x.disabled=true);if(o===current.a){b.classList.add('correct');$('questionFeedback').textContent='Rätt! Μπράβο! 🎉'}else{b.classList.add('wrong');[...$('answers').children].find(x=>x.textContent===current.a).classList.add('correct');$('questionFeedback').textContent='Titta tillbaka på sagans slut och fundera igen.'}};$('answers').appendChild(b)})}
$('prev').onclick=()=>{if(page>0){page--;renderPage()}};$('next').onclick=()=>{if(page<pageData[current.key].length-1){page++;renderPage()}};$('listen').onclick=()=>speak(storyPage(pageData[current.key][page],page).greek);$('close').onclick=()=>{speechSynthesis.cancel();$('reader').classList.add('hide');renderCards(document.querySelector('#filters button.active').dataset.filter);window.scrollTo({top:0,behavior:'smooth'})};let storyTextSize=Math.min(29,Math.max(17,+(localStorage.getItem('greekStoryTextSize')||21))),showSwedish=localStorage.getItem('greekStorySwedish')!=='hidden';function applyReadingSupport(){$('readerGreek').style.fontSize=storyTextSize+'px';$('readerSwedish').style.fontSize=Math.max(15,storyTextSize-4)+'px';$('readerSwedish').classList.toggle('hide',!showSwedish);$('translationNote').classList.toggle('hide',!showSwedish);$('toggleSwedish').textContent=showSwedish?'🇸🇪 Dölj svenska':'🇸🇪 Visa svenska';localStorage.setItem('greekStoryTextSize',storyTextSize);localStorage.setItem('greekStorySwedish',showSwedish?'shown':'hidden')}$('smallerText').onclick=()=>{storyTextSize=Math.max(17,storyTextSize-2);applyReadingSupport()};$('largerText').onclick=()=>{storyTextSize=Math.min(29,storyTextSize+2);applyReadingSupport()};$('toggleSwedish').onclick=()=>{showSwedish=!showSwedish;applyReadingSupport()};applyReadingSupport();renderCards();
</script></body></html>
